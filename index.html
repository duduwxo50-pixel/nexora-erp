<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora ERP Pro - Funcional</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --sidebar: #070b16;
      --accent: #1a7fff;
      --accent2: #00d4ff;
      --green: #00c896;
      --red: #ff4d6a;
      --text: #e2e8f2;
      --muted: #6b7a90;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); }
    #auth-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse 80% 60% at 55% 30%,rgba(26,127,255,0.1),transparent 70%),linear-gradient(180deg,#08101f,#0b0f1a); }
    .auth-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:22px; padding:44px 40px; width:100%; max-width:420px; }
    .auth-logo { font-size:22px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
    .form-group input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:9px; padding:11px 14px; color:var(--text); }
    .btn-primary { width:100%; background:linear-gradient(135deg,var(--accent),#0050cc); border:none; color:#fff; padding:13px; border-radius:9px; cursor:pointer; font-weight:700; }
    .btn-primary:hover { opacity:.88; }
    .auth-link { text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
    .auth-link a { color:var(--accent2); text-decoration:none; cursor:pointer; }
    #app-screen { display:flex; min-height:100vh; }
    .sidebar { width:240px; background:var(--sidebar); border-right:1px solid var(--border); position:fixed; top:0; bottom:0; left:0; }
    .sidebar-logo { padding:20px; font-size:18px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; border-bottom:1px solid var(--border); }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; margin:2px 8px; border-radius:9px; cursor:pointer; color:var(--muted); }
    .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
    .nav-item.active { background:rgba(26,127,255,0.15); color:var(--accent2); }
    .main { margin-left:240px; flex:1; }
    .topbar { background:rgba(11,15,26,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 28px; height:58px; display:flex; align-items:center; justify-content:space-between; }
    .content { padding:26px 28px; }
    [id^="mod-"] { display:none; }
    .dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
    .dash-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
    .dash-card-val { font-size:26px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:11px 14px; border-bottom:1px solid var(--border); }
    .btn-action { background:linear-gradient(135deg,var(--accent),#0050cc); border:none; color:#fff; padding:10px 18px; border-radius:9px; cursor:pointer; }
    .toast { position:fixed; bottom:20px; right:20px; background:#141928; border:1px solid var(--border); padding:12px 18px; border-radius:10px; z-index:9999; opacity:0; transition:all .3s; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">NEXORA ERP PRO</div>
    <div id="login-form">
      <h2>Iniciar sesión</h2>
      <div class="form-group"><label>Email</label><input id="login-email" type="email"></div>
      <div class="form-group"><label>Contraseña</label><input id="login-pass" type="password"></div>
      <button id="btn-login" class="btn-primary">Entrar</button>
      <p class="auth-link"><a id="link-to-register">Registrar empresa</a></p>
    </div>
    <div id="register-form" style="display:none">
      <h2>Registrar empresa</h2>
      <div class="form-group"><label>Tu nombre</label><input id="reg-name"></div>
      <div class="form-group"><label>Nombre del negocio</label><input id="reg-biz"></div>
      <div class="form-group"><label>Email</label><input id="reg-email" type="email"></div>
      <div class="form-group"><label>Contraseña</label><input id="reg-pass" type="password"></div>
      <button id="btn-register" class="btn-primary">Registrar</button>
      <p class="auth-link"><a id="link-to-login">Volver a iniciar sesión</a></p>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">NEXORA ERP</div>
    <div class="nav-item active" data-module="dashboard"><span>📊 Dashboard</span></div>
    <div class="nav-item" data-module="inventario"><span>📦 Inventario</span></div>
    <div class="nav-item" data-module="facturas"><span>🧾 Facturas</span></div>
    <div class="sidebar-footer" style="margin-top:auto; padding:14px; border-top:1px solid var(--border);">
      <div class="user-info"><div id="user-name">—</div><div id="user-role"></div></div>
      <button id="btn-logout" class="btn-primary" style="margin-top:10px">Salir</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"><div id="mod-title">Dashboard</div><span id="topbar-biz"></span></div>
    <div class="content" id="main-content"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// Configuración Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAxyjIZBxBa6hBqAMzw84NE0vUULWibIaU",
  authDomain: "nexora-erp-2b417.firebaseapp.com",
  projectId: "nexora-erp-2b417",
  storageBucket: "nexora-erp-2b417.firebasestorage.app",
  messagingSenderId: "803467842564",
  appId: "1:803467842564:web:ceee51faad6dbae218d151"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentTenant = null;
let currentUserRole = null;

const $ = id => document.getElementById(id);
const toast = (msg, type='success') => {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.remove(), 3200);
};

// Mostrar módulos (simplificado)
window.loadModule = async (mod) => {
  document.querySelectorAll('.nav-item').forEach(i => i.classList.toggle('active', i.dataset.module === mod));
  document.querySelectorAll('[id^="mod-"]').forEach(m => m.style.display = 'none');
  if (!$( `mod-${mod}` )) {
    const div = document.createElement('div');
    div.id = `mod-${mod}`;
    $('#main-content').appendChild(div);
  }
  $(`mod-${mod}`).style.display = 'block';
  $('#mod-title').textContent = mod.charAt(0).toUpperCase() + mod.slice(1);
  if (mod === 'dashboard') await cargarDashboard();
  if (mod === 'inventario') await cargarInventario();
  if (mod === 'facturas') await cargarFacturas();
};

// Autenticación
onAuthStateChanged(auth, async (user) => {
  if (user) {
    console.log("Usuario autenticado:", user.email);
    const userDocRef = doc(db, 'users', user.uid);
    let userSnap = await getDoc(userDocRef);
    if (!userSnap.exists()) {
      // Primer inicio: crear perfil y empresa
      const bizRef = doc(collection(db, 'businesses'));
      await setDoc(bizRef, { name: "Mi Negocio", ownerUid: user.uid, createdAt: serverTimestamp() });
      await setDoc(userDocRef, {
        email: user.email,
        name: user.displayName || user.email.split('@')[0],
        role: 'admin',
        pin: '1234',
        businessId: bizRef.id
      });
      userSnap = await getDoc(userDocRef);
    }
    const userData = userSnap.data();
    currentUserRole = userData.role;
    currentTenant = userData.businessId;
    $('#user-name').textContent = userData.name;
    $('#user-role').textContent = userData.role;
    const biz = await getDoc(doc(db, 'businesses', currentTenant));
    $('#topbar-biz').textContent = biz.exists() ? biz.data().name : 'Mi Negocio';
    $('#auth-screen').style.display = 'none';
    $('#app-screen').style.display = 'flex';
    loadModule('dashboard');
  } else {
    $('#auth-screen').style.display = 'flex';
    $('#app-screen').style.display = 'none';
  }
});

// Login
$('#btn-login').addEventListener('click', async () => {
  const email = $('#login-email').value.trim();
  const pass = $('#login-pass').value;
  if (!email || !pass) { toast('Complete todos los campos', 'error'); return; }
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    toast('Bienvenido');
  } catch(e) { toast('Error: ' + e.message, 'error'); }
});

// Registro
$('#btn-register').addEventListener('click', async () => {
  const name = $('#reg-name').value.trim();
  const bizName = $('#reg-biz').value.trim();
  const email = $('#reg-email').value.trim();
  const pass = $('#reg-pass').value;
  if (!name || !bizName || !email || !pass) { toast('Complete todos los campos', 'error'); return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    // Crear empresa y perfil en Firestore
    const bizRef = doc(collection(db, 'businesses'));
    await setDoc(bizRef, { name: bizName, ownerUid: cred.user.uid, createdAt: serverTimestamp() });
    await setDoc(doc(db, 'users', cred.user.uid), {
      email, name, role: 'admin', pin: '1234', businessId: bizRef.id
    });
    toast('Empresa registrada. Inicia sesión');
    $('#link-to-login').click();
  } catch(e) { toast(e.message, 'error'); }
});

// Cambio entre formularios
$('#link-to-register').addEventListener('click', (e) => {
  e.preventDefault();
  $('#login-form').style.display = 'none';
  $('#register-form').style.display = 'block';
});
$('#link-to-login').addEventListener('click', (e) => {
  e.preventDefault();
  $('#register-form').style.display = 'none';
  $('#login-form').style.display = 'block';
});
$('#btn-logout').addEventListener('click', () => signOut(auth));

// Funciones de ejemplo para módulos
async function cargarDashboard() {
  const productos = (await getDocs(collection(db, 'businesses', currentTenant, 'productos'))).size;
  const facturas = (await getDocs(collection(db, 'businesses', currentTenant, 'facturas'))).size;
  $('#mod-dashboard').innerHTML = `<div class="dash-grid"><div class="dash-card"><div class="dash-card-label">📦 Productos</div><div class="dash-card-val">${productos}</div></div><div class="dash-card"><div class="dash-card-label">🧾 Facturas</div><div class="dash-card-val">${facturas}</div></div></div><div class="table-wrap"><h3>Bienvenido a Nexora ERP Pro</h3></div>`;
}

async function cargarInventario() {
  const snap = await getDocs(collection(db, 'businesses', currentTenant, 'productos'));
  let html = `<div class="toolbar"><button class="btn-action" onclick="alert('Nuevo producto')">+ Nuevo producto</button></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead><tbody>`;
  snap.forEach(doc => {
    const p = doc.data();
    html += `<tr><td>${p.nombre}</td><td>$${p.precio}</td><td>${p.stock}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  $('#mod-inventario').innerHTML = html;
}

async function cargarFacturas() {
  const snap = await getDocs(collection(db, 'businesses', currentTenant, 'facturas'));
  let html = `<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th></tr></thead><tbody>`;
  snap.forEach(doc => {
    const f = doc.data();
    html += `<tr><td>${f.numero}</td><td>${f.cliente}</td><td>$${f.total}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  $('#mod-facturas').innerHTML = html;
}

// Crear módulos vacíos
['dashboard', 'inventario', 'facturas'].forEach(mod => {
  const div = document.createElement('div');
  div.id = `mod-${mod}`;
  $('#main-content').appendChild(div);
});
</script>
</body>
</html>
