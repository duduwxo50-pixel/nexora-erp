<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora ERP Pro - Corregido</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --sidebar: #070b16;
      --accent: #1a7fff;
      --accent2: #00d4ff;
      --green: #00c896;
      --red: #ff4d6a;
      --text: #e2e8f2;
      --muted: #6b7a90;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    input, button { font-family:inherit; }
    #auth-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse 80% 60% at 55% 30%,rgba(26,127,255,0.1),transparent 70%),linear-gradient(180deg,#08101f,#0b0f1a); }
    .auth-card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.09); border-radius:22px; padding:44px 40px; width:100%; max-width:420px; backdrop-filter:blur(24px); }
    .auth-logo { font-size:22px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:4px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
    .form-group input { width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:9px; padding:11px 14px; color:var(--text); }
    .btn-primary { width:100%; background:linear-gradient(135deg,var(--accent),#0050cc); border:none; color:#fff; padding:13px; border-radius:9px; cursor:pointer; font-weight:700; }
    .btn-primary:hover { opacity:.88; }
    .auth-link { text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
    .auth-link a { color:var(--accent2); text-decoration:none; cursor:pointer; }
    #app-screen { display:flex; min-height:100vh; }
    .sidebar { width:240px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; }
    .sidebar-logo { padding:20px; font-size:18px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; border-bottom:1px solid var(--border); }
    .nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; margin:2px 8px; border-radius:9px; cursor:pointer; color:var(--muted); transition:all .2s; }
    .nav-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
    .nav-item.active { background:rgba(26,127,255,0.15); color:var(--accent2); }
    .nav-item .icon { width:22px; }
    .sidebar-footer { margin-top:auto; padding:14px; border-top:1px solid var(--border); }
    .user-info { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .user-avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2)); display:flex; align-items:center; justify-content:center; font-weight:800; }
    .btn-logout { width:100%; background:rgba(255,77,106,0.1); border:1px solid rgba(255,77,106,0.22); color:#ff4d6a; padding:8px; border-radius:8px; cursor:pointer; }
    .main { margin-left:240px; flex:1; }
    .topbar { position:sticky; top:0; background:rgba(11,15,26,0.92); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 28px; height:58px; display:flex; align-items:center; justify-content:space-between; }
    .content { padding:26px 28px; }
    [id^="mod-"] { display:none; }
    .dash-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
    .dash-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .dash-card-val { font-size:26px; font-weight:900; background:linear-gradient(90deg,var(--accent2),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .table-wrap { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); }
    th { font-size:11px; text-transform:uppercase; color:var(--muted); }
    .toolbar { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .btn-action { background:linear-gradient(135deg,var(--accent),#0050cc); border:none; color:#fff; padding:10px 18px; border-radius:9px; cursor:pointer; font-weight:700; }
    .btn-icon { background:rgba(255,255,255,0.05); border:1px solid var(--border); padding:5px 9px; border-radius:7px; cursor:pointer; margin-right:3px; }
    .toast { position:fixed; bottom:20px; right:20px; background:#141928; border:1px solid var(--border); padding:12px 18px; border-radius:10px; z-index:9999; opacity:0; transition:all .3s; }
    .toast.show { opacity:1; }
    @media (max-width:800px) { .sidebar { width:60px; } .sidebar span:not(.icon) { display:none; } .main { margin-left:60px; } }
  </style>
</head>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">NEXORA ERP PRO</div>
    <div id="login-form">
      <h2>Iniciar sesión</h2>
      <div class="form-group"><label>Email</label><input id="login-email" type="email"></div>
      <div class="form-group"><label>Contraseña</label><input id="login-pass" type="password"></div>
      <button id="btn-login" class="btn-primary">Entrar</button>
      <p class="auth-link"><a href="#" id="link-to-register">Registrar empresa</a></p>
    </div>
    <div id="register-form" style="display:none">
      <h2>Registrar empresa</h2>
      <div class="form-group"><label>Tu nombre</label><input id="reg-name"></div>
      <div class="form-group"><label>Nombre del negocio</label><input id="reg-biz"></div>
      <div class="form-group"><label>Email</label><input id="reg-email" type="email"></div>
      <div class="form-group"><label>Contraseña</label><input id="reg-pass" type="password"></div>
      <button id="btn-register" class="btn-primary">Registrar</button>
      <p class="auth-link"><a href="#" id="link-to-login">Volver a iniciar sesión</a></p>
    </div>
  </div>
</div>

<div id="app-screen" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">NEXORA ERP</div>
    <div class="nav-item active" data-module="dashboard"><span class="icon">📊</span><span>Dashboard</span></div>
    <div class="nav-item" data-module="inventario"><span class="icon">📦</span><span>Inventario</span></div>
    <div class="nav-item" data-module="cotizaciones"><span class="icon">📄</span><span>Cotizaciones</span></div>
    <div class="nav-item" data-module="facturas"><span class="icon">🧾</span><span>Facturas</span></div>
    <div class="nav-item" data-module="compras"><span class="icon">🛒</span><span>Compras</span></div>
    <div class="nav-item" data-module="clientes"><span class="icon">👥</span><span>Clientes</span></div>
    <div class="nav-item" data-module="proveedores"><span class="icon">🚚</span><span>Proveedores</span></div>
    <div class="nav-item" data-module="papelera"><span class="icon">🗑️</span><span>Papelera</span></div>
    <div class="nav-item admin-only" data-module="admin" style="display:none"><span class="icon">⚙️</span><span>Admin</span></div>
    <div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="user-avatar">U</div><div><div id="user-name">—</div><div id="user-role" class="user-biz"></div></div></div><button id="btn-logout" class="btn-logout">Salir</button></div>
  </aside>
  <div class="main"><div class="topbar"><div id="mod-title">Dashboard</div><span id="topbar-biz" class="topbar-biz"></span></div><div class="content" id="main-content"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAxyjIZBxBa6hBqAMzw84NE0vUULWibIaU",
  authDomain: "nexora-erp-2b417.firebaseapp.com",
  projectId: "nexora-erp-2b417",
  storageBucket: "nexora-erp-2b417.firebasestorage.app",
  messagingSenderId: "803467842564",
  appId: "1:803467842564:web:ceee51faad6dbae218d151"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null, currentTenant = null, currentUserRole = null, currentUserPin = null;
const $ = id => document.getElementById(id);
const toast = (msg, type='success') => { const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.classList.add('show'),10); setTimeout(()=>t.remove(),3200); };
const esc = str => { const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; };

// Funciones auxiliares de Firestore (requieren currentTenant)
const tenantCol = (col) => collection(db, 'businesses', currentTenant, col);
const tenantDoc = (col, id) => doc(db, 'businesses', currentTenant, col, id);

// Permisos
function hasPermission(module) {
  if (!currentUserRole) return false;
  if (currentUserRole === 'admin') return true;
  if (currentUserRole === 'comercial') return ['dashboard','clientes','cotizaciones','facturas'].includes(module);
  if (currentUserRole === 'compras') return ['dashboard','inventario','proveedores','compras'].includes(module);
  return false;
}
function applyRolePermissions() {
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = currentUserRole === 'admin' ? 'flex' : 'none');
  document.querySelectorAll('.nav-item[data-module]').forEach(item => {
    item.style.display = hasPermission(item.dataset.module) ? 'flex' : 'none';
  });
}

// Papelera
async function moverAPapelera(coleccion, id, datos) {
  await addDoc(collection(db, 'businesses', currentTenant, 'papelera'), { coleccionOriginal: coleccion, documentoId: id, datos, eliminadoPor: currentUser.uid, eliminadoEn: serverTimestamp() });
  await deleteDoc(tenantDoc(coleccion, id));
  toast('Movido a papelera');
}
async function recuperarDePapelera(itemId) {
  const papeleraDoc = await getDoc(doc(db, 'businesses', currentTenant, 'papelera', itemId));
  if (!papeleraDoc.exists()) return;
  const { coleccionOriginal, documentoId, datos } = papeleraDoc.data();
  await setDoc(tenantDoc(coleccionOriginal, documentoId), datos);
  await deleteDoc(papeleraDoc.ref);
  toast('Restaurado');
}

// Carga de módulos
window.loadModule = async (mod) => {
  if (!hasPermission(mod)) { toast('Sin permiso','error'); return; }
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active',i.dataset.module===mod));
  document.querySelectorAll('[id^="mod-"]').forEach(m=>m.style.display='none');
  if (!$(`mod-${mod}`)) { const div=document.createElement('div'); div.id=`mod-${mod}`; $('#main-content').appendChild(div); }
  $(`mod-${mod}`).style.display='block';
  $('#mod-title').textContent=mod.charAt(0).toUpperCase()+mod.slice(1);
  if (mod==='dashboard') await cargarDashboard();
  if (mod==='inventario') await cargarInventario();
  if (mod==='cotizaciones') await cargarCotizaciones();
  if (mod==='facturas') await cargarFacturas();
  if (mod==='compras') await cargarCompras();
  if (mod==='clientes') await cargarClientes();
  if (mod==='proveedores') await cargarProveedores();
  if (mod==='papelera') await cargarPapelera();
  if (mod==='admin' && currentUserRole==='admin') await cargarAdmin();
};

// Autenticación
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const userDocRef = doc(db, 'users', user.uid);
    let userSnap = await getDoc(userDocRef);
    if (!userSnap.exists()) {
      await setDoc(userDocRef, {
        email: user.email,
        name: user.displayName || user.email.split('@')[0],
        role: 'admin',
        pin: '1234',
        businessId: null
      });
      userSnap = await getDoc(userDocRef);
    }
    const userData = userSnap.data();
    currentUserRole = userData.role;
    currentUserPin = userData.pin;
    if (!userData.businessId) {
      const bizRef = doc(collection(db, 'businesses'));
      await setDoc(bizRef, { name: "Mi Negocio", ownerUid: user.uid, createdAt: serverTimestamp() });
      await updateDoc(userDocRef, { businessId: bizRef.id });
      currentTenant = bizRef.id;
    } else {
      currentTenant = userData.businessId;
    }
    const biz = await getDoc(doc(db, 'businesses', currentTenant));
    const topbarBiz = $('#topbar-biz');
    if (topbarBiz) topbarBiz.textContent = biz.exists() ? biz.data().name : 'Mi Negocio';
    const userName = $('#user-name');
    if (userName) userName.textContent = userData.name;
    const userAvatar = $('#user-avatar');
    if (userAvatar) userAvatar.textContent = userData.name[0].toUpperCase();
    const userRole = $('#user-role');
    if (userRole) userRole.textContent = userData.role;
    const authScreen = $('#auth-screen');
    if (authScreen) authScreen.style.display = 'none';
    const appScreen = $('#app-screen');
    if (appScreen) appScreen.style.display = 'flex';
    applyRolePermissions();
    loadModule('dashboard');
  } else {
    const authScreen = $('#auth-screen');
    if (authScreen) authScreen.style.display = 'flex';
    const appScreen = $('#app-screen');
    if (appScreen) appScreen.style.display = 'none';
  }
});

// Esperar a que el DOM esté completamente cargado antes de asignar eventos
document.addEventListener('DOMContentLoaded', () => {
  const btnLogin = $('#btn-login');
  if (btnLogin) {
    btnLogin.addEventListener('click', async () => {
      const email = $('#login-email').value.trim();
      const pass = $('#login-pass').value;
      if (!email || !pass) { toast('Complete todos los campos', 'error'); return; }
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(e) { toast('Error: ' + e.message, 'error'); }
    });
  }

  const btnRegister = $('#btn-register');
  if (btnRegister) {
    btnRegister.addEventListener('click', async () => {
      const name = $('#reg-name').value.trim();
      const bizName = $('#reg-biz').value.trim();
      const email = $('#reg-email').value.trim();
      const pass = $('#reg-pass').value;
      if (!name || !bizName || !email || !pass) { toast('Complete todos los campos', 'error'); return; }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        const bizRef = doc(collection(db, 'businesses'));
        await setDoc(bizRef, { name: bizName, ownerUid: cred.user.uid, createdAt: serverTimestamp() });
        await setDoc(doc(db, 'users', cred.user.uid), {
          email, name, role: 'admin', pin: '1234', businessId: bizRef.id
        });
        toast('Empresa registrada. Inicia sesión');
        const linkToLogin = $('#link-to-login');
        if (linkToLogin) linkToLogin.click();
      } catch(e) { toast(e.message, 'error'); }
    });
  }

  const linkRegister = $('#link-to-register');
  if (linkRegister) {
    linkRegister.addEventListener('click', (e) => {
      e.preventDefault();
      const loginForm = $('#login-form');
      const registerForm = $('#register-form');
      if (loginForm) loginForm.style.display = 'none';
      if (registerForm) registerForm.style.display = 'block';
    });
  }

  const linkLogin = $('#link-to-login');
  if (linkLogin) {
    linkLogin.addEventListener('click', (e) => {
      e.preventDefault();
      const registerForm = $('#register-form');
      const loginForm = $('#login-form');
      if (registerForm) registerForm.style.display = 'none';
      if (loginForm) loginForm.style.display = 'block';
    });
  }

  const btnLogout = $('#btn-logout');
  if (btnLogout) {
    btnLogout.addEventListener('click', () => signOut(auth));
  }
});

// Módulos (todos verifican currentTenant antes de usar tenantCol)
async function cargarDashboard() {
  if (!currentTenant) return;
  const productos = (await getDocs(tenantCol('productos'))).size;
  const cotizaciones = (await getDocs(tenantCol('cotizaciones'))).size;
  const facturas = (await getDocs(tenantCol('facturas'))).size;
  const clientes = (await getDocs(tenantCol('clientes'))).size;
  const mod = $('#mod-dashboard');
  if (mod) mod.innerHTML = `<div class="dash-grid"><div class="dash-card"><div class="dash-card-label">📦 Productos</div><div class="dash-card-val">${productos}</div></div><div class="dash-card"><div class="dash-card-label">📄 Cotizaciones</div><div class="dash-card-val">${cotizaciones}</div></div><div class="dash-card"><div class="dash-card-label">🧾 Facturas</div><div class="dash-card-val">${facturas}</div></div><div class="dash-card"><div class="dash-card-label">👥 Clientes</div><div class="dash-card-val">${clientes}</div></div></div>`;
}
async function cargarInventario() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('productos'), orderBy('nombre')));
  const mod = $('#mod-inventario');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><input class="toolbar-search" id="prod-search" placeholder="Buscar..."><button class="btn-action" onclick="window.openProductoModal()">+ Nuevo producto</button></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Mín</th><th>Acciones</th></tr></thead><tbody id="prod-tbody"></tbody></table></div>`;
  const tbody = $('#prod-tbody');
  if (tbody) {
    snap.forEach(doc => { const p=doc.data(); tbody.innerHTML += `<tr><td>${esc(p.nombre)}</td><td>$${p.precio}</td><td>${p.stock}</td><td>${p.stockMin}</td><td><button class="btn-icon" onclick="window.editProducto('${doc.id}')">✏️</button><button class="btn-icon danger" onclick="window.eliminarProducto('${doc.id}','${p.nombre}')">🗑️</button></td></tr>`; });
  }
}
window.openProductoModal = () => { alert("Abrir modal para nuevo producto"); };
window.editProducto = (id) => { alert("Editar producto "+id); };
window.eliminarProducto = async (id,nombre) => { if(confirm(`¿Mover "${nombre}" a papelera?`)){ const docSnap=await getDoc(tenantDoc('productos',id)); if(docSnap.exists()) await moverAPapelera('productos',id,docSnap.data()); cargarInventario(); } };
async function cargarClientes() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('clientes'), orderBy('nombre')));
  const mod = $('#mod-clientes');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><input class="toolbar-search" id="cliente-search" placeholder="Buscar..."><button class="btn-action" onclick="window.openClienteModal()">+ Nuevo cliente</button></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Acciones</th></tr></thead><tbody id="cliente-tbody"></tbody></table></div>`;
  const tbody = $('#cliente-tbody');
  if (tbody) {
    snap.forEach(doc => { const c=doc.data(); tbody.innerHTML += `<tr><td>${esc(c.nombre)}</td><td>${esc(c.email||'')}</td><td>${esc(c.telefono||'')}</td><td><button class="btn-icon" onclick="window.editCliente('${doc.id}')">✏️</button><button class="btn-icon danger" onclick="window.eliminarCliente('${doc.id}','${c.nombre}')">🗑️</button></td></tr>`; });
  }
}
window.openClienteModal = () => { alert("Abrir modal para nuevo cliente"); };
window.editCliente = (id) => { alert("Editar cliente "+id); };
window.eliminarCliente = async (id,nombre) => { if(confirm(`Mover "${nombre}" a papelera?`)){ const docSnap=await getDoc(tenantDoc('clientes',id)); if(docSnap.exists()) await moverAPapelera('clientes',id,docSnap.data()); cargarClientes(); } };
async function cargarProveedores() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('proveedores'), orderBy('nombre')));
  const mod = $('#mod-proveedores');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><input class="toolbar-search" id="proveedor-search" placeholder="Buscar..."><button class="btn-action" onclick="window.openProveedorModal()">+ Nuevo proveedor</button></div><div class="table-wrap"></table><thead><tr><th>Nombre</th><th>Contacto</th><th>Teléfono</th><th>Acciones</th></tr></thead><tbody id="proveedor-tbody"></tbody></table></div>`;
  const tbody = $('#proveedor-tbody');
  if (tbody) {
    snap.forEach(doc => { const p=doc.data(); tbody.innerHTML += `<tr><td>${esc(p.nombre)}</td><td>${esc(p.contacto||'')}</td><td>${esc(p.telefono||'')}</td><td><button class="btn-icon" onclick="window.editProveedor('${doc.id}')">✏️</button><button class="btn-icon danger" onclick="window.eliminarProveedor('${doc.id}','${p.nombre}')">🗑️</button></td></tr>`; });
  }
}
window.openProveedorModal = () => { alert("Abrir modal para nuevo proveedor"); };
window.editProveedor = (id) => { alert("Editar proveedor "+id); };
window.eliminarProveedor = async (id,nombre) => { if(confirm(`Mover "${nombre}" a papelera?`)){ const docSnap=await getDoc(tenantDoc('proveedores',id)); if(docSnap.exists()) await moverAPapelera('proveedores',id,docSnap.data()); cargarProveedores(); } };
async function cargarCotizaciones() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('cotizaciones'), orderBy('createdAt','desc')));
  const mod = $('#mod-cotizaciones');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><button class="btn-action" onclick="window.openCotizacionModal()">+ Nueva cotización</button></div><div class="table-wrap"></table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="cot-tbody"></tbody></table></div>`;
  const tbody = $('#cot-tbody');
  if (tbody) {
    snap.forEach(doc => { const c=doc.data(); tbody.innerHTML += `<tr><td>${c.numero}</td><td>${c.cliente}</td><td>$${c.total}</td><td>${c.estado}</td><td><button class="btn-icon" onclick="window.editCotizacion('${doc.id}')">✏️</button><button class="btn-icon danger" onclick="window.eliminarCotizacion('${doc.id}','${c.numero}')">🗑️</button></td></tr>`; });
  }
}
window.openCotizacionModal = () => { alert("Abrir modal para cotización"); };
window.editCotizacion = (id) => { alert("Editar cotización "+id); };
window.eliminarCotizacion = async (id,numero) => { if(confirm(`Mover cotización ${numero} a papelera?`)){ const docSnap=await getDoc(tenantDoc('cotizaciones',id)); if(docSnap.exists()) await moverAPapelera('cotizaciones',id,docSnap.data()); cargarCotizaciones(); } };
async function cargarCompras() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('compras'), orderBy('createdAt','desc')));
  const mod = $('#mod-compras');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><button class="btn-action" onclick="window.openCompraModal()">+ Registrar compra</button></div><div class="table-wrap"><tr><thead><tr><th>Proveedor</th><th>Fecha</th><th>Total</th><th>Acciones</th></tr></thead><tbody id="compras-tbody"></tbody></table></div>`;
  const tbody = $('#compras-tbody');
  if (tbody) {
    snap.forEach(doc => { const c=doc.data(); tbody.innerHTML += `<tr><td>${c.proveedorNombre}</td><td>${c.fecha}</td><td>$${c.total}</td><td><button class="btn-icon danger" onclick="window.eliminarCompra('${doc.id}')">🗑️</button></td></tr>`; });
  }
}
window.openCompraModal = () => { alert("Abrir modal para compra"); };
window.eliminarCompra = async (id) => { if(confirm("Mover compra a papelera?")){ const docSnap=await getDoc(tenantDoc('compras',id)); if(docSnap.exists()) await moverAPapelera('compras',id,docSnap.data()); cargarCompras(); } };
async function cargarFacturas() {
  if (!currentTenant) return;
  const snap = await getDocs(query(tenantCol('facturas'), orderBy('createdAt','desc')));
  const mod = $('#mod-facturas');
  if (!mod) return;
  mod.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Número</th><th>Cliente</th><th>Total</th><th>Acciones</th></tr></thead><tbody id="facturas-tbody"></tbody></table></div>`;
  const tbody = $('#facturas-tbody');
  if (tbody) {
    snap.forEach(doc => { const f=doc.data(); tbody.innerHTML += `<tr><td>${f.numero}</td><td>${f.cliente}</td><td>$${f.total}</td><td><button class="btn-icon" onclick="window.editarFactura('${doc.id}')">✏️ Editar</button><button class="btn-icon" onclick="window.imprimirFactura('${doc.id}')">🖨️</button><button class="btn-icon danger" onclick="window.eliminarFactura('${doc.id}')">🗑️</button></td></tr>`; });
  }
}
window.editarFactura = async (id) => {
  const pin = prompt("Ingrese PIN de 4 dígitos (por defecto 1234):");
  if (pin !== currentUserPin) { toast("PIN incorrecto", "error"); return; }
  const facturaDoc = await getDoc(tenantDoc('facturas', id));
  if (!facturaDoc.exists()) return;
  const data = facturaDoc.data();
  const nuevoDescuento = prompt("Nuevo descuento (%)", data.descuento || 0);
  if (nuevoDescuento !== null) {
    const descuento = parseFloat(nuevoDescuento);
    const subtotal = data.subtotal || 0;
    const iva = data.iva || 19;
    const descMonto = subtotal * descuento / 100;
    const subtotalDesc = subtotal - descMonto;
    const ivaMonto = subtotalDesc * iva / 100;
    const nuevoTotal = subtotalDesc + ivaMonto;
    await updateDoc(tenantDoc('facturas', id), { descuento, total: nuevoTotal, updatedAt: serverTimestamp() });
    toast("Factura actualizada");
    cargarFacturas();
  }
};
window.eliminarFactura = async (id) => { if (confirm("Mover factura a papelera?")) { const docSnap=await getDoc(tenantDoc('facturas',id)); if(docSnap.exists()) await moverAPapelera('facturas',id,docSnap.data()); cargarFacturas(); } };
window.imprimirFactura = async (id) => {
  const facturaDoc = await getDoc(tenantDoc('facturas', id));
  if (!facturaDoc.exists()) return;
  const f = facturaDoc.data();
  const w = window.open('', '_blank');
  w.document.write(`<html><body><pre>FACTURA ${f.numero}\nCliente: ${f.cliente}\nTotal: $${f.total}</pre></body></html>`);
  w.print();
};
async function cargarPapelera() {
  if (!currentTenant) return;
  const snap = await getDocs(query(collection(db, 'businesses', currentTenant, 'papelera'), orderBy('eliminadoEn', 'desc')));
  const mod = $('#mod-papelera');
  if (!mod) return;
  mod.innerHTML = `<div class="table-wrap"><tr><thead><tr><th>Colección</th><th>ID Original</th><th>Datos</th><th>Acciones</th></tr></thead><tbody id="papelera-tbody"></tbody></table></div>`;
  const tbody = $('#papelera-tbody');
  if (tbody) {
    snap.forEach(doc => { const item=doc.data(); tbody.innerHTML += `<tr><td>${item.coleccionOriginal}</td><td>${item.documentoId}</td><td><pre>${JSON.stringify(item.datos).substring(0,50)}...</pre></td><td><button class="btn-icon" onclick="window.recuperarItem('${doc.id}')">↩️ Recuperar</button><button class="btn-icon danger" onclick="window.eliminarDefinitivo('${doc.id}')">❌ Eliminar</button></td></tr>`; });
  }
}
window.recuperarItem = async (id) => { await recuperarDePapelera(id); cargarPapelera(); };
window.eliminarDefinitivo = async (id) => { if (confirm('Eliminar definitivamente?')) { await deleteDoc(doc(db, 'businesses', currentTenant, 'papelera', id)); cargarPapelera(); } };
async function cargarAdmin() {
  if (!currentTenant) return;
  const usersSnap = await getDocs(collection(db, 'users'));
  const mod = $('#mod-admin');
  if (!mod) return;
  mod.innerHTML = `<div class="toolbar"><button class="btn-action" onclick="window.crearUsuarioModal()">+ Nuevo usuario</button></div><div class="table-wrap"><tr><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>PIN</th><th>Acciones</th></tr></thead><tbody id="admin-users-tbody"></tbody></table></div>`;
  const tbody = $('#admin-users-tbody');
  if (tbody) {
    usersSnap.forEach(doc => { const u=doc.data(); if(u.businessId===currentTenant) { tbody.innerHTML += `<tr><td>${u.name}</td><td>${u.email}</td><td><select onchange="window.cambiarRol('${doc.id}', this.value)"><option ${u.role==='admin'?'selected':''}>admin</option><option ${u.role==='comercial'?'selected':''}>comercial</option><option ${u.role==='compras'?'selected':''}>compras</option></select></td><td><button class="btn-icon" onclick="window.cambiarPin('${doc.id}')">Cambiar PIN</button></td><td><button class="btn-icon danger" onclick="window.eliminarUsuario('${doc.id}')">🗑️</button></td></tr>`; } });
  }
}
window.cambiarRol = async (userId, newRole) => { if(currentUserRole!=='admin') return; await updateDoc(doc(db,'users',userId),{role:newRole}); toast('Rol actualizado'); cargarAdmin(); };
window.cambiarPin = async (userId) => { const newPin=prompt('Nuevo PIN de 4 dígitos'); if(newPin && newPin.length===4) { await updateDoc(doc(db,'users',userId),{pin:newPin}); toast('PIN actualizado'); } else toast('PIN inválido','error'); };
window.crearUsuarioModal = () => { alert("Para crear usuarios, regístrelos primero en Firebase Authentication y luego asígneles rol y PIN aquí"); };
window.eliminarUsuario = async (userId) => { if(confirm("¿Eliminar usuario?")) { await deleteDoc(doc(db,'users',userId)); toast("Usuario eliminado"); cargarAdmin(); } };

// Crear contenedores de módulos al inicio
document.addEventListener('DOMContentLoaded', () => {
  const modules = ['dashboard','inventario','cotizaciones','facturas','compras','clientes','proveedores','papelera','admin'];
  modules.forEach(mod => {
    if (!$(`mod-${mod}`)) {
      const div = document.createElement('div');
      div.id = `mod-${mod}`;
      const mainContent = $('#main-content');
      if (mainContent) mainContent.appendChild(div);
    }
  });
});
</script>
